[project]
name = "ecvla"
version = "0.1.0"
description = "Edge-cloud split inference for robot policies (EXP-0001 and follow-ups)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "h5py",
    "pyyaml>=6.0.3",
    "pillow>=12.3.0",
    "torch>=2.10,<2.15",
    "torchvision",
]

[project.optional-dependencies]
libero = [
    "hf-libero==0.1.4",
    "robosuite==1.4.0",
    "mujoco",
]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecvla"]

[tool.uv.extra-build-dependencies]
# egl-probe / hf-egl-probe (via hf-libero -> robomimic) build with CMake (<4: old cmake_minimum_required), which the HPC lacks
egl-probe = ["cmake<4"]
hf-egl-probe = ["cmake<4"]

# CUDA 12.6 builds: the HPC GPU nodes have a CUDA 12.9 driver, and PyPI's default torch 2.15 wheel (cu132) needs 13.x,
# so torch silently fell back to CPU there. 2.14.1 is the newest release with a cu12 build.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
