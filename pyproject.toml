[project]
name = "ecvla"
version = "0.1.0"
description = "Edge-cloud split inference for robot policies (EXP-0001 and follow-ups)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "h5py",
    "pyyaml>=6.0.3",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
libero = [
    "hf-libero==0.1.4",
    "robosuite==1.4.0",
    "mujoco",
]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecvla"]
