# EXP-0005 slow-model environment (pi05_base / LeRobot), separate from the main project:
# LeRobot needs torch < 2.12 while the main env pins 2.14.1+cu126. torch comes from LeRobot's own uv source (the
# cu128 index), which the HPC's CUDA 12.9 driver supports. LeRobot is pinned to the commit read in the EXP-0005
# stage-0 code check (0.6.2 is not on PyPI).
[project]
name = "ecvla-vlm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[pi] @ git+https://github.com/huggingface/lerobot@f5c9bc02137c331b009eccd44ece6f11b62187a8",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy",
]

[tool.uv]
package = false
